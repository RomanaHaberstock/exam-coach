<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Exam Coach</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2F4BD8">
<meta name="description" content="A study planner that builds your plan backwards from the exam date, quizzes you on your own materials and adapts when you fall behind.">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top"><div class="top-in">
  <div class="brand"><span>Exam</span> Coach</div>
  <nav id="nav" aria-label="Sections">
    <button data-view="dashboard"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Today</span></button>
    <button data-view="plan"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>Plan</span></button>
    <button data-view="exams"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/></svg><span class="long">Exams &amp; materials</span><span class="short">Exams</span></button>
    <button data-view="quiz"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></svg><span>Quiz</span></button>
    <button data-view="you"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="long">About you</span><span class="short">You</span></button>
    <button data-view="history"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><span class="long">Plan changes</span><span class="short">Changes</span></button>
    <button data-view="how"><svg class="ico" aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5h.01"/></svg><span class="long">How it works</span><span class="short">How</span></button>
  </nav>
  <div class="topstat"><button class="streakchip off" id="streakchip" hidden data-goto="dashboard"></button>
  <div class="savestate" id="savestate">Loading…</div></div>
</div></header>
<main id="main" tabindex="-1"><div class="panel"><span class="spinner"></span> Loading your plan…</div></main>
<div class="timer" id="timer"></div>
<div class="toast" id="toast" hidden></div>
<div class="sr-only" id="live" role="status" aria-live="polite"></div>

<script src="assets/vendor/pdfjs/pdf.min.js"></script>
<script src="assets/app.js"></script>
<script src="assets/demo.js"></script>
</body>
</html>
